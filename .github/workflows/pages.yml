name: Deploy security research portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 05 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate disclosure-safe data
        run: |
          python3 -m unittest discover -s tests -v
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/monitor_public_credit.py --check-cves
          else
            python3 scripts/monitor_public_credit.py
          fi
          python3 scripts/validate_public_data.py
          python3 scripts/validate_public_tracker.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
